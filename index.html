<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#352B29">
  <meta name="color-scheme" content="light only">
  <meta name="supported-color-schemes" content="light">
  <meta name="description" content="Marc Rjeily — Executive, Advisor and Investor. Strategy, Growth and Partnerships.">
  <title>Marc Rjeily</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: only light;
      --espresso: #352b29;
      --ivory: #f4eee6;
      --paper: #fbf8f3;
      --gold: #a18964;
      --gold-light: #c4aa7c;
      --ink: #352b29;
      --muted: #68737a;
      --shadow: 0 24px 70px rgba(37, 27, 25, .25);
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background-color: #352b29;
      color-scheme: only light;
    }

    body {
      min-height: 100svh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 82% 10%, rgba(196, 170, 124, .10), transparent 26rem),
        linear-gradient(165deg, #2b201f 0%, #352b29 52%, #47342f 100%);
      font-family: "Montserrat", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      forced-color-adjust: none;
    }

    .page {
      min-height: 100svh;
      display: grid;
      grid-template-rows: minmax(310px, 47svh) auto;
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 44px 24px 76px;
      position: relative;
      overflow: hidden;
      text-align: center;
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 290px;
      height: 290px;
      right: -155px;
      bottom: -170px;
      border: 1px solid rgba(196, 170, 124, .17);
      transform: rotate(18deg);
    }

    .identity { position: relative; z-index: 1; }

    .monogram {
      width: 92px;
      height: auto;
      display: block;
      margin: 0 auto 24px;
      opacity: .98;
    }

    h1 {
      margin: 0;
      color: var(--ivory);
      line-height: 1;
    }

    .name-art {
      display: block;
      width: min(75.5vw, 526px);
      height: auto;
      margin: 0 auto;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .gold-rule {
      width: 74px;
      height: 2px;
      margin: 25px auto 21px;
      background: linear-gradient(90deg, var(--gold), var(--gold-light));
    }

    .role {
      margin: 0;
      color: var(--gold-light);
      font-family: "Cormorant SC", Georgia, serif;
      font-size: clamp(.92rem, 4vw, 1.15rem);
      font-weight: 600;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .content {
      position: relative;
      z-index: 2;
      width: min(100%, 720px);
      margin: -38px auto 0;
      padding: 0 16px max(24px, env(safe-area-inset-bottom));
    }

    .card {
      overflow: hidden;
      border: 1px solid rgba(161, 137, 100, .36);
      border-radius: 2px;
      background:
        linear-gradient(rgba(244, 238, 230, .96), rgba(244, 238, 230, .96)),
        repeating-linear-gradient(45deg, rgba(53, 43, 41, .025) 0 1px, transparent 1px 4px);
      box-shadow: var(--shadow);
    }

    .positioning {
      padding: 31px 22px 26px;
      text-align: center;
      border-bottom: 1px solid rgba(161, 137, 100, .30);
    }

    .positioning p {
      margin: 0;
      color: var(--ink);
      font-family: "Cormorant SC", Georgia, serif;
      font-size: clamp(1rem, 4.5vw, 1.25rem);
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .positioning .mobile-group { display: inline; }

    .intro {
      margin: 0;
      padding: 22px 24px 0;
      color: #4e5f68;
      font-size: .82rem;
      line-height: 1.75;
      text-align: center;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 11px;
      padding: 22px;
    }

    .action {
      min-height: 62px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      border: 1px solid rgba(53, 43, 41, .15);
      border-radius: 2px;
      color: var(--ink);
      background: rgba(255, 255, 255, .36);
      text-decoration: none;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .action:active { transform: scale(.985); }

    .action:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }

    .action svg {
      width: 22px;
      height: 22px;
      flex: 0 0 auto;
      color: var(--gold);
    }

    .action-text { min-width: 0; }

    .action strong {
      display: block;
      margin-bottom: 3px;
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .10em;
      text-transform: uppercase;
    }

    .action span {
      display: block;
      overflow: hidden;
      color: var(--muted);
      font-size: .69rem;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .footer {
      padding: 0 22px 23px;
      color: var(--gold);
      font-family: "Cormorant SC", Georgia, serif;
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .24em;
      text-align: center;
      text-transform: uppercase;
    }

    @media (hover: hover) {
      .action:hover {
        transform: translateY(-2px);
        border-color: rgba(161, 137, 100, .65);
        background: rgba(255, 255, 255, .68);
      }
    }

    @media (max-width: 440px) {
      .hero { padding-inline: 16px; }
      .positioning p { line-height: 1.65; }
      .positioning .mobile-group { display: block; }
      .positioning .between { display: none; }
      .actions { grid-template-columns: 1fr; }
      .action { min-height: 60px; }
    }

    @media (min-width: 760px) {
      .page { grid-template-rows: minmax(380px, 55svh) auto; }
      .content { margin-top: -54px; }
      .actions { padding: 28px; gap: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .action { transition: none; }
    }

    /* Keep the brand palette unchanged when the device uses dark mode. */
    @media (prefers-color-scheme: dark) {
      html,
      body {
        color-scheme: only light;
        background-color: #352b29 !important;
      }

      body {
        color: #352b29 !important;
        background:
          radial-gradient(circle at 82% 10%, rgba(196, 170, 124, .10), transparent 26rem),
          linear-gradient(165deg, #2b201f 0%, #352b29 52%, #47342f 100%) !important;
      }

      .card {
        background:
          linear-gradient(rgba(244, 238, 230, .96), rgba(244, 238, 230, .96)),
          repeating-linear-gradient(45deg, rgba(53, 43, 41, .025) 0 1px, transparent 1px 4px) !important;
      }

      .action {
        color: #352b29 !important;
        background-color: rgba(255, 255, 255, .36) !important;
      }

      .intro { color: #4e5f68 !important; }
      .action span { color: #68737a !important; }
    }
  </style>
</head>

  <script>
    (function () {
      var isAndroid = /Android/i.test(navigator.userAgent);
      if (!isAndroid) return;

      var profileUrl = "https://www.linkedin.com/in/marc-rjeily/";
      var vcardUrl = "https://marcrjeily.github.io/marc-rjeily.vcf";

      /* Ask Android to open Marc's profile in the installed LinkedIn app. */
      document.getElementById("linkedin-link").href =
        "intent://www.linkedin.com/in/marc-rjeily/#Intent;" +
        "scheme=https;package=com.linkedin.android;" +
        "S.browser_fallback_url=" + encodeURIComponent(profileUrl) + ";end";

      /* Open Android's Add Contact screen with the main details prefilled. */
      document.getElementById("save-contact-link").href =
        "intent://com.android.contacts/contacts#Intent;" +
        "scheme=content;action=android.intent.action.INSERT;" +
        "type=vnd.android.cursor.dir/contact;" +
        "S.name=Marc%20Rjeily;" +
        "S.phone=%2B971567406730;" +
        "S.email=marc.rjeily%40outlook.com;" +
        "S.job_title=Executive%20%C2%B7%20Advisor%20%C2%B7%20Investor;" +
        "S.notes=Strategy%20%C2%B7%20Growth%20%C2%B7%20Transformation%20%C2%B7%20Partnerships;" +
        "S.browser_fallback_url=" + encodeURIComponent(vcardUrl) + ";end";
      document.getElementById("save-contact-link").removeAttribute("type");
    }());
  </script>
